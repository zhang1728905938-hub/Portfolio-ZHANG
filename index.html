<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const theme = localStorage.getItem('rui-zhang-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0a0a0a' : '#ffffff';
      } catch {}
    </script>
    <style>:root { background: #fff; } :root[data-theme="dark"] { background: #0a0a0a; }</style>
    <meta name="description" content="Rui Zhang — architectural designer. An exploration of architecture, space, and new possibilities." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rui Zhang Portfolio — Architecture & Possibility</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
